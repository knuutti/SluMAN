name: Discord release notification

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post release to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          NAME: ${{ github.event.release.name || github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # Discord embed descriptions are capped at 4096 characters
          if [ ${#BODY} -gt 3900 ]; then
            BODY="${BODY:0:3900}…"$'\n\n'"[Read the full release notes]($URL)"
          fi

          # Green for full releases, orange for pre-releases
          COLOR=5763719
          if [ "$PRERELEASE" = "true" ]; then COLOR=15105570; fi

          jq -n \
            --arg name "$NAME" --arg url "$URL" --arg body "$BODY" --argjson color "$COLOR" \
            '{
              content: "**\($name)** is out!",
              embeds: [{ title: $name, url: $url, description: $body, color: $color }]
            }' \
          | curl -sSf -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"
